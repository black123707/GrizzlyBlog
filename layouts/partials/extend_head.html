<style>
.social-icons a {
  transition: transform 0.2s ease, opacity 0.2s ease;
  margin: 0 8px;
  display: inline-block;
}

.social-icons a:hover {
  transform: translateY(-3px) scale(1.15);
  opacity: 0.85;
}

.social-icons a[href*="github.com"]:hover svg {
  fill: #24292f !important;
}

.social-icons a[href*="bilibili.com"]:hover svg {
  fill: #FB7299 !important;
}

.social-icons a[href*="xiaohongshu.com"]:hover svg {
  fill: #FF2442 !important;
}

.write-btn {
  background: #1a1a1a !important;
  color: #fff !important;
  padding: 6px 18px !important;
  border-radius: 24px !important;
  font-size: 0.85rem !important;
  font-weight: 500 !important;
  letter-spacing: 0.02em;
  transition: all 0.2s ease !important;
  margin-left: 4px;
}

.write-btn:hover {
  background: #333 !important;
  transform: translateY(-1px) !important;
  opacity: 1 !important;
}

</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // 尝试多种可能的选择器
  const subtitle = document.querySelector('.profile-subtitle') 
                || document.querySelector('.profile .subtitle')
                || document.querySelector('.home-info .entry-content')
                || document.querySelector('.profile_inner span:last-of-type');
  
  if (!subtitle) {
    console.log('Typewriter: 未找到副标题元素');
    return;
  }
  
  const text = subtitle.innerText.trim() || "Per aspera ad astra.";
  if (!text) return;
  
  subtitle.innerHTML = '';
  subtitle.style.minHeight = '1.5em';
  
  let i = 0;
  function type() {
    if (i < text.length) {
      subtitle.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, 100);
    }
  }
  type();
});
</script>
