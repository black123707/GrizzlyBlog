<style>
/* 打字机光标 */
.typewriter-cursor {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  background: currentColor;
  margin-left: 2px;
  vertical-align: text-bottom;
  animation: blink 1s step-end infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
  
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

/* 全局应用打字机字体（英文优先，中文回退到系统字体） */
body, .post-content, .post-title, h1, h2, h3, h4, h5, h6, 
.entry-header, .profile .title, .profile .subtitle, 
.post-meta, .pagetitle, .breadcrumbs, nav a, .post-card h3 {
  font-family: 'Special Elite', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  letter-spacing: 0.03em;  /* 打字机字体稍微拉开字距更好看 */
}

/* 代码块保持专业等宽，但换更干净的 Courier Prime */
pre, code, kbd, samp {
  font-family: 'Courier Prime', 'Courier New', monospace !important;
}

  /* 暗色模式切换过渡动画 */
body, .post-content, .post-card, .profile, header, nav {
  transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}
  
.social-icons a {
  transition: transform 0.2s ease, opacity 0.2s ease;
  margin: 0 8px;
  display: inline-block;
}

.social-icons a:hover {
  transform: translateY(-3px) scale(1.15);
  opacity: 0.85;
}

.social-icons a[href*="github.com"]:hover svg {
  fill: #24292f !important;
}

.social-icons a[href*="bilibili.com"]:hover svg {
  fill: #FB7299 !important;
}

.social-icons a[href*="xiaohongshu.com"]:hover svg {
  fill: #FF2442 !important;
}
</style>

<script>
  const quotes = [
    "Per aspera ad astra.",
    "Stay hungry, stay foolish.",
    "Less is more.",
    "Think different.",
    "Done is better than perfect.",
    "Be the change you wish to see.",
    "Simplicity is the ultimate sophistication."
  ];
  const text = quotes[Math.floor(Math.random() * quotes.length)];
  
document.addEventListener('DOMContentLoaded', function() {
  // 1. Write 按钮样式
  document.querySelectorAll('nav a, header a, #menu a').forEach(function(link) {
    if (link.textContent.trim() === 'Write') {
      link.style.cssText = 'background:#1a1a1a !important;color:#fff !important;padding:3px 14px !important;border-radius:20px !important;font-size:0.8rem !important;font-weight:500 !important;letter-spacing:0.02em !important;transition:all 0.2s ease !important;margin-left:4px !important;display:inline-block !important;line-height:1.4 !important;';
      link.addEventListener('mouseenter', function() {
        this.style.background = '#333';
        this.style.transform = 'translateY(-1px)';
      });
      link.addEventListener('mouseleave', function() {
        this.style.background = '#1a1a1a';
        this.style.transform = '';
      });
    }
  });

  // 3. 打字机效果
  const subtitle = document.querySelector('.profile-subtitle') 
                || document.querySelector('.profile .subtitle')
                || document.querySelector('.home-info .entry-content')
                || document.querySelector('.profile_inner span:last-of-type');
  if (!subtitle) {
    console.log('Typewriter: 未找到副标题元素');
    return;
  }
  const text = subtitle.innerText.trim() || "Per aspera ad astra.";
  if (!text) return;
  subtitle.innerHTML = '';
  subtitle.style.minHeight = '1.5em';
    let i = 0;
  function type() {
    if (i < text.length) {
      subtitle.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, 100);
    } else {
      // 打字结束后插入闪烁光标
      const cursor = document.createElement('span');
      cursor.className = 'typewriter-cursor';
      subtitle.appendChild(cursor);
    }
  }
  type();
    }
  }
  type();
});
</script>
