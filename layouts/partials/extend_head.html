<style>
  /* 暗色模式切换过渡动画 */
body, .post-content, .post-card, .profile, header, nav {
  transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}
  
.social-icons a {
  transition: transform 0.2s ease, opacity 0.2s ease;
  margin: 0 8px;
  display: inline-block;
}

.social-icons a:hover {
  transform: translateY(-3px) scale(1.15);
  opacity: 0.85;
}

.social-icons a[href*="github.com"]:hover svg {
  fill: #24292f !important;
}

.social-icons a[href*="bilibili.com"]:hover svg {
  fill: #FB7299 !important;
}

.social-icons a[href*="xiaohongshu.com"]:hover svg {
  fill: #FF2442 !important;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // 1. Write 按钮样式
  document.querySelectorAll('nav a, header a, #menu a').forEach(function(link) {
    if (link.textContent.trim() === 'Write') {
      link.style.cssText = 'background:#1a1a1a !important;color:#fff !important;padding:3px 14px !important;border-radius:20px !important;font-size:0.8rem !important;font-weight:500 !important;letter-spacing:0.02em !important;transition:all 0.2s ease !important;margin-left:4px !important;display:inline-block !important;line-height:1.4 !important;';
      link.addEventListener('mouseenter', function() {
        this.style.background = '#333';
        this.style.transform = 'translateY(-1px)';
      });
      link.addEventListener('mouseleave', function() {
        this.style.background = '#1a1a1a';
        this.style.transform = '';
      });
    }
  });

  // 3. 打字机效果
  const subtitle = document.querySelector('.profile-subtitle') 
                || document.querySelector('.profile .subtitle')
                || document.querySelector('.home-info .entry-content')
                || document.querySelector('.profile_inner span:last-of-type');
  if (!subtitle) {
    console.log('Typewriter: 未找到副标题元素');
    return;
  }
  const text = subtitle.innerText.trim() || "Per aspera ad astra.";
  if (!text) return;
  subtitle.innerHTML = '';
  subtitle.style.minHeight = '1.5em';
  let i = 0;
  function type() {
    if (i < text.length) {
      subtitle.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, 100);
    }
  }
  type();
});
</script>
