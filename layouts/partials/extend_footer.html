<!-- ===== 访客计数 ===== -->

<div class="site-stats">
  <span id="busuanzi_container_site_pv">总访问量 <span id="busuanzi_value_site_pv"></span> 次</span>
  ·

<!-- ===== 最新文章卡片 ===== -->
<div id="latest-posts" style="display:none;">
  <h2>最新文章</h2>
  <div class="post-cards" id="post-cards"></div>
  <div class="view-all">
    <a href="/posts">查看全部文章</a>
  </div>
</div>

<script>
(function() {
  if (window.location.pathname !== '/' && window.location.pathname !== '/index.html') return;

  fetch('/index.xml')
    .then(r => r.text())
    .then(xml => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xml, 'application/xml');
      const items = Array.from(doc.querySelectorAll('item'))
        .filter(item => {
          const link = item.querySelector('link')?.textContent || '';
          const title = item.querySelector('title')?.textContent || '';
          return !link.includes('/about') && title.toLowerCase() !== 'about';
        })
        .slice(0, 3);
      
      if (items.length === 0) return;
      // ... 后面不变

      const container = document.getElementById('post-cards');
      items.forEach(item => {
        const title = item.querySelector('title')?.textContent || '无标题';
        const link = item.querySelector('link')?.textContent || '#';
        const dateStr = item.querySelector('pubDate')?.textContent || '';
        const date = dateStr ? new Date(dateStr).toLocaleDateString('zh-CN') : '';

        const card = document.createElement('article');
        card.className = 'post-card';
        card.innerHTML = '<a href="' + link + '"><h3>' + title + '</h3><time>' + date + '</time></a>';
        container.appendChild(card);
      });

      document.getElementById('latest-posts').style.display = 'block';
    })
    .catch(() => {});
})();
</script>

<style>

}
</style>

<div id="back-to-top" style="position: fixed; bottom: 28px; right: 28px; width: 42px; height: 42px; background: #1a1a1a; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 9999; box-shadow: 0 4px 14px rgba(0,0,0,0.2); transform: translateY(10px);">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
</div>

<script>
(function() {
  const btn = document.getElementById('back-to-top');
  if (!btn) return;
  
  window.addEventListener('scroll', function() {
    if (window.scrollY > 400) {
      btn.style.opacity = '1';
      btn.style.visibility = 'visible';
      btn.style.transform = 'translateY(0)';
    } else {
      btn.style.opacity = '0';
      btn.style.visibility = 'hidden';
      btn.style.transform = 'translateY(10px)';
    }
  });
  
  btn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
})();
</script>
