baseURL = 'https://grizzlyblog.pages.dev'
languageCode = 'en-us'
title = 'My Blog'
theme = 'PaperMod'

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  [params.profileMode]
    enabled = true
    title = "㌍㌫㌶㌫㌶"
    subtitle = "Per aspera ad astra."
    imageUrl = "/images/avatar.jpg"
    imageWidth = 120
    imageHeight = 120
    buttons = [
      {name = "文章", url = "/posts"},
      {name = "关于", url = "/about"}
    ]
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/black123707"
  [[params.socialIcons]]
    name = "bilibili"
    url = "https://space.bilibili.com/520208446?spm_id_from=333.1007.0.0"

[minify]
  disableXML = true

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 20
