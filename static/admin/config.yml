# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: black123707/GrizzlyBlog
  branch: main
  identity_url: https://auth.decapbridge.com/sites/6a1d659f-ff3f-47f9-adfc-c3a3ffb69f33
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://grizzlyblog.pages.dev

media_folder: static/images/uploads
public_folder: /images/uploads

[asset]
  fingerprint = "sha256"

collections:
  # ==========================================
  # 1. 分类 (Categories) 集合
  # ==========================================
  - name: "categories"
    label: "分类"
    folder: "content/categories"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "名称", name: "title", widget: "string" }

  # ==========================================
  # 2. 文章 (Posts) 集合
  # ==========================================
  - name: "posts"
    label: "文章"
    folder: "content/posts"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - label: "分类"
        name: "categories"
        widget: "relation"
        collection: "categories"
        search_fields: ["title"]
        value_field: "title"
        display_fields: ["title"]
        multiple: true
        required: false
      - { label: "正文", name: "body", widget: "markdown" }

  # ==========================================
  # 3. 关于页面 (About) - 单独管理
  # ==========================================
  - name: "about"
    label: "关于页面"
    files:
      - label: "About"
        name: "about"
        file: "content/about.md"
        fields:
          - { label: "标题", name: "title", widget: "string", default: "About" }
          - { label: "描述", name: "description", widget: "text", required: false }
          - { label: "草稿", name: "draft", widget: "boolean", default: false }
          - { label: "正文", name: "body", widget: "markdown" }

  # ==========================================
  # 4. 页面 (Pages) 集合
  # ==========================================
  - name: "pages"
    label: "页面"
    folder: "content"
    create: true
    delete: true
    slug: "{{slug}}"
    filter:
      field: type
      value: page
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "类型", name: "type", widget: "hidden", default: "page" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }

  # ==========================================
  # 5. 说说 (Memos) 集合
  # ==========================================
  - name: "memos"
    label: "说说"
    folder: "content/memos"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "发布时间", name: "date", widget: "datetime" }
      - { label: "正文内容", name: "body", widget: "markdown" }
